<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>In Loving Memory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block" rel="stylesheet">
<style>
  .msr{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;
       font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;
       font-size:20px;line-height:1;display:inline-block;letter-spacing:normal;
       text-transform:none;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased}
  :root{
    --ink:#1A1917; --ink2:#5C574F; --ink3:#8B857C;
    --paper:#F7F5F1; --card:#FFFFFF; --line:#E6E1D9;
  }
  body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--paper);color:var(--ink)}
  /* 深色壁龛面板（与 App 纪念页一致）：近黑→深紫→暖暗，底部圆角 */
  .hero{background:linear-gradient(180deg,#100D14 0%,#1D1626 55%,#372A35 100%);
        padding:64px 24px 58px;text-align:center;
        border-radius:0 0 26px 26px}
  .arch{width:88px;height:82px;margin:0 auto 16px;position:relative;
        border:1.5px solid rgba(236,236,206,.18);border-bottom:0;
        border-radius:44px 44px 0 0;display:grid;place-items:center;font-size:30px}
  .arch::after{content:'';position:absolute;bottom:6px;left:50%;transform:translateX(-50%);
        width:26px;height:32px;border-radius:50%;
        background:radial-gradient(circle at 50% 62%,rgba(205,138,138,.4),transparent 70%)}
  h1{color:#fff;font-size:26px;margin:0;letter-spacing:-.02em}
  .dates{color:rgba(255,255,255,.75);font-size:14px;margin-top:6px}
  .card{max-width:560px;margin:-40px auto 0;background:var(--card);border:1px solid var(--line);
        border-radius:18px;padding:22px;text-align:center;
        box-shadow:0 10px 30px rgba(20,15,25,.08)}
  .loving{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700}
  .epitaph{font-style:italic;color:var(--ink2);font-size:15px;margin-top:10px;line-height:1.6}
  .counts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px}
  .count{width:88px;flex:none;background:#F7F5F1;border-radius:12px;padding:10px 4px}
  .count .n{font-size:17px;font-weight:700;color:var(--ink)}
  .count .l{font-size:11px;color:var(--ink3);margin-top:2px}
  .sect{max-width:560px;margin:30px auto;padding:0 16px}
  .sect h2{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);
        margin:0 0 10px;padding-left:2px}
  .tribute,.msg{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:13px 16px;margin-bottom:10px}
  .album{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .album img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block}
  .ev{display:flex;gap:14px;padding:9px 2px;border-bottom:1px solid rgba(0,0,0,.06)}
  .ev:last-child{border-bottom:0}
  .ev .d{flex:none;width:92px;font-size:12.5px;font-weight:600;color:var(--ink2)}
  .ev .t{font-size:14px;color:var(--ink)}
  .bio{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:14px 16px;font-size:14.5px;line-height:1.65;color:var(--ink2);
        white-space:pre-wrap}
  .tribute{display:flex;align-items:center;gap:12px}
  .tribute .ico{font-size:19px;width:34px;height:34px;border-radius:50%;background:#F7F5F1;
        display:grid;place-items:center;flex:none}
  .tribute .who{font-weight:600;font-size:14px}
  .tribute .what{font-size:13px;color:var(--ink2);margin-top:1px}
  .tribute .when,.msg .when{margin-left:auto;font-size:11.5px;color:var(--ink3);flex:none}
  .msg .who{font-weight:600;font-size:14px;display:flex;align-items:baseline;gap:8px}
  .msg .tx{font-size:14.5px;color:var(--ink2);margin-top:4px;line-height:1.55}
  .empty{color:var(--ink3);font-size:14px;padding:14px 2px}
  .note{max-width:560px;margin:26px auto 44px;padding:0 16px;text-align:center;
        color:#B4AEA4;font-size:12px;line-height:1.6}
  .loading{text-align:center;color:var(--ink3);padding:60px 20px;font-size:14px}
  .notpublic{text-align:center;padding:70px 24px}
  .notpublic .flame{font-size:34px;margin-bottom:14px}
  .notpublic h1{color:var(--ink);font-size:20px}
</style>
</head>
<body>
  <div id="page" style="display:none">
    <div class="hero">
      <div class="arch"><span class="msr" style="font-size:30px;color:#F2D9A6">light_mode</span></div>
      <h1 id="name">…</h1>
      <div class="dates" id="dates"></div>
    </div>
    <div class="card">
      <div class="loving">In Loving Memory</div>
      <div class="epitaph" id="epitaph" style="display:none"></div>
      <div class="counts" id="counts"></div>
    </div>
    <div class="sect" id="bioSect" style="display:none">
      <h2 id="bioTitle">Bio</h2>
      <div class="bio" id="bio"></div>
    </div>
    <div class="sect" id="albumSect" style="display:none">
      <h2 id="albumTitle">Album</h2>
      <div class="album" id="album"></div>
    </div>
    <div class="sect" id="evSect" style="display:none">
      <h2 id="evTitle">Life events</h2>
      <div id="events"></div>
    </div>
    <div class="sect">
      <h2>Tributes</h2>
      <div id="tributes"></div>
    </div>
    <div class="sect" style="margin-top:6px">
      <h2>Messages</h2>
      <div id="messages"></div>
    </div>
    <div class="note">
      Kept with Lararium — the shrine your family keeps.<br>
      This page is read-only and shared privately by the family.
    </div>
  </div>
  <div id="loading" class="loading">Loading…</div>
  <div id="notpublic" class="notpublic" style="display:none">
    <div class="flame"><span class="msr" style="font-size:34px;color:#B4AEA4">light_mode</span></div>
    <h1>This memorial page is not public.</h1>
  </div>

<script>
const SUPABASE_URL = 'https://sdxhduusacwnimcrkkqv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkeGhkdXVzYWN3bmltY3Jra3F2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1NDU2ODMsImV4cCI6MjEwNzEyMTY4M30.V39Gt2UbFcwo76y2Odda5MQ_Vg2WpopGB_0H3nfZ6CQ';

const pid = new URLSearchParams(location.search).get('p');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function rpc(fn, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function fmtDate(d) {
  if (!d) return '';
  return new Date(d).toLocaleDateString('en-US', {year:'numeric', month:'short', day:'numeric'});
}

const KIND = {
  flower:   {ico:'local_florist',  label:'offered flowers'},
  marigold: {ico:'filter_vintage', label:'offered marigolds'},
  garland:  {ico:'local_florist',  label:'placed a garland'},
  candle:   {ico:'light_mode',     label:'lit a candle'},
  diya:     {ico:'light_mode',     label:'lit a diya'},
  ofrenda:  {ico:'card_giftcard',  label:'added to the ofrenda'},
  stone:    {ico:'landscape',      label:'placed a stone'},
  incense:  {ico:'air',            label:'burned incense'},
  prayer:   {ico:'self_improvement', label:'said a prayer'},
  bow:      {ico:'south',          label:'bowed in respect'},
  donation: {ico:'favorite',       label:'made a donation'},
  memory:   {ico:'photo_library',  label:'shared a memory'},
};
const kindOf = (k, item) => {
  const key = item || k; // item_code 更精确（如 bow 存为 prayer/item=bow 时）
  return KIND[k] || KIND[key] || {ico:'💐', label:'sent a tribute'};
};

function notPublic() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('notpublic').style.display = 'block';
}

async function load() {
  if (!pid || !/^[0-9a-f-]{36}$/i.test(pid)) return notPublic();
  try {
    const m = await rpc('get_public_memorial', { pid });
    if (!m) return notPublic();

    document.title = 'In Loving Memory · ' + m.name;
    document.getElementById('name').textContent = m.name;
    document.getElementById('dates').textContent =
      [fmtDate(m.birth), fmtDate(m.death)].filter(Boolean).join(' – ');
    if (m.epitaph) {
      const el = document.getElementById('epitaph');
      el.textContent = '“' + m.epitaph + '”';
      el.style.display = 'block';
    }

    const c = m.counts || {};
    const kc = m.kind_counts || {};
    const v = (k) => c[k] ?? kc[k] ?? 0;
    const items = [
      ['local_florist', v('flower'), 'Flowers'],
      ['light_mode', v('candle'), 'Candles'],
      ['air', v('incense'), 'Incense'],
      ['self_improvement', v('prayer'), 'Prayers'],
      ['filter_vintage', v('marigold'), 'Marigolds'],
      ['local_florist', v('garland'), 'Garlands'],
      ['south', v('bow'), 'Bows'],
      ['landscape', v('stone'), 'Stones'],
      ['light_mode', v('diya'), 'Diyas'],
      ['card_giftcard', v('ofrenda'), 'Ofrenda'],
      ['favorite', v('donation'), 'Donations'],
      ['photo_library', v('memory'), 'Memories'],
    ];
    document.getElementById('counts').innerHTML = items.map(([ico, n, l]) =>
      `<div class="count"><div class="n"><span class="msr" style="font-size:16px;vertical-align:-3px">${ico}</span> ${n}</div><div class="l">${l}</div></div>`
    ).join('');

    // 祝福明细：谁送了什么（只读）
    // 简介
    if (m.bio) {
      document.getElementById('bio').textContent = m.bio;
      document.getElementById('bioSect').style.display = 'block';
    }
    // 相册（公开对象 URL）
    const album = m.album || [];
    if (album.length) {
      document.getElementById('album').innerHTML = album.map((a) =>
        `<img loading="lazy"
             src="${SUPABASE_URL}/storage/v1/object/person-album/${encodeURIComponent(a.path)}"
             alt="${esc(a.caption || '')}">`
      ).join('');
      document.getElementById('albumSect').style.display = 'block';
      document.getElementById('albumTitle').textContent = 'Album';
    }
    // 大事记
    const evs = m.events || [];
    if (evs.length) {
      document.getElementById('events').innerHTML = evs.map((e) =>
        `<div class="ev"><div class="d">${fmtDate(e.date)}</div>
         <div class="t">${esc(e.title)}${e.place ? ' · ' + esc(e.place) : ''}</div></div>`
      ).join('');
      document.getElementById('evSect').style.display = 'block';
    }
    const tr = m.tributes || [];
    document.getElementById('tributes').innerHTML = tr.length ? tr.map((a) => {
      const k = kindOf(a.kind, a.item);
      return `<div class="tribute"><div class="ico"><span class="msr">${k.ico}</span></div>
        <div style="flex:1;min-width:0"><div class="who">${esc(a.who)}</div>
        <div class="what">${k.label}</div></div>
        <div class="when">${fmtDate(a.at)}</div></div>`;
    }).join('') : '<div class="empty">No tributes yet.</div>';

    // 留言（只读）
    const msgs = m.messages || [];
    document.getElementById('messages').innerHTML = msgs.length ? msgs.map((msg) =>
      `<div class="msg"><div class="who">${esc(msg.author)}
        <span class="when">${fmtDate(msg.at)}</span></div>
        <div class="tx">${esc(msg.body)}</div></div>`
    ).join('') : '<div class="empty">No messages yet.</div>';

    document.getElementById('loading').style.display = 'none';
    document.getElementById('page').style.display = 'block';
  } catch (e) {
    notPublic();
  }
}

load();
</script>
</body>
</html>

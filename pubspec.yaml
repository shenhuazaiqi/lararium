name: tree
description: "Lararium — The shrine your family keeps. Family tree app."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- 状态 / 路由 ---
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # --- 本地存储（唯一数据源） ---
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3

  # --- 国际化 ---
  intl: 0.19.0

  uuid: ^4.5.1

  # --- 云同步（阶段 3 基础；本地 SQLite 仍是唯一真源） ---
  supabase_flutter: ^2.8.4

  # --- 导出（阶段 2） ---
  pdf: ^3.11.1
  share_plus: ^10.0.2
  file_picker: ^8.1.2

  # --- Google 一键登录 ---
  google_sign_in: ^6.2.1

  # --- 提醒（阶段 5） ---
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

# Flutter 3.24 gradle 插件兼容：app_links 6.4+ 需要新版 flutter gradle 扩展
dependency_overrides:
  app_links: 6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  drift_dev: ^2.22.2
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true

name: tree
description: "Lararium — The shrine your family keeps. Family tree app."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- 状态 / 路由 ---
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # --- 本地存储（唯一数据源） ---
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3

  # --- 国际化 ---
  intl: 0.19.0

  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  drift_dev: ^2.22.2
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true
